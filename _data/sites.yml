# 페이지 모음 데이터
# 새 사이트를 추가할 때는 해당 카테고리의 sites 목록에 항목을 추가하면 됩니다.
# name: 화면에 보이는 이름 / url: 주소 / desc: 한 줄 설명 / tag: 기술·성격 표시

- id: blog
  color: "#3f6b52"
  name: 블로그 · 기록
  description: 생각과 일상을 쌓아 두는 공간
  sites:
    - name: 신규하 블로그
      url: https://gyuha.com/
      desc: 글과 프로젝트, 실험적인 시도들을 기록하는 개인 블로그.
      tag: Blog
    - name: IT News
      url: https://it-news.gyuha.com/
      desc: AI가 매일 정리해 주는 IT 뉴스.
      tag: AI
    - name: Life Log
      url: https://life-log.gyuha.com/
      desc: 일상과 기술을 함께 기록하는 라이프로그.
      tag: Life
    - name: Game Dev Log
      url: https://game.gyuha.com/
      desc: 게임 개발 정보와 기술 튜토리얼, 개발 일지를 모으는 블로그.
      tag: Game Dev

